name: Smoke

on:
  push:
    branches: [main]
  pull_request:

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release -p triagex-cli
      # GitHub's Ubuntu runners have Docker, so this exercises real containers and a real Redis.
      - name: Smoke test (real Docker and Redis)
        run: TRIAGEX=./target/release/triagex ./scripts/smoke.sh
