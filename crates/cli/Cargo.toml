[package]
name = "triagex-cli"
version = "0.1.0"
edition = "2024"

[dependencies]
clap = { version = "4.6.7", features = ["derive"] }
libc = "0.2.191"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
triagex-core = { version = "0.1.0", path = "../core" }

[[bin]]
name = "triagex"
path = "src/main.rs"
